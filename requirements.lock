# 文件：requirements.lock
# 作用：锁死当前可复现环境（requirements.txt 的声明 + 其传递依赖），供 CI 与复现使用
# 阶段：P0 起（2026-09-20 首版）
# 生成：从 requirements.txt 出发做依赖闭包，取本机 .venv 已装版本；改依赖先改 requirements.txt 再重生成
# 平台：按 Windows 求值，平台相关项带 marker（Linux/CI 照装不报错）；uvloop 只在 Linux 生效故不在锁定范围内
# 重生成：2026-09-22（F9 收口；补齐 F7/F8/F9 的依赖与 4 处版本漂移：click 8.5.0→8.3.3、fsspec、huggingface-hub、jiter）
# 命令：pip install --dry-run --ignore-installed --report - -r requirements.txt 取名字集合（版本取本机 .venv），
#       再对 requirements.lock 自身反复求闭包，直到「resolver 不再新增」的固定点（CI 装的就是这份）
