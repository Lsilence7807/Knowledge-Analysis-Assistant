<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>知析 · AI 数据分析助手</title>
<script src="/vendor/echarts.min.js"></script>
<style>
  :root{
    --paper:#FFF7E8; --card:#FFFDF8; --ink:#17130E; --ink-soft:#443C31; --muted:#6E6455;
    --violet:#6B4BF6; --violet-dark:#5433D6; --yellow:#FFD34D; --coral:#FF6A54; --mint:#2F9E5F;
    --hair:#E7DFCE; --radius:16px; --shadow:6px 6px 0 var(--ink);
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{
    margin:0; padding:28px 28px 72px; background:var(--paper); color:var(--ink);
    font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif; -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.55;
    background-image:radial-gradient(var(--hair) 1.2px, transparent 1.2px); background-size:24px 24px;
  }
  header.topbar, section, #banner{position:relative; z-index:1}

  header.topbar{
    max-width:1080px; margin:0 auto 18px; padding:16px 20px; display:flex; align-items:center; gap:14px;
    flex-wrap:wrap; background:var(--card); border:3px solid var(--ink); border-radius:var(--radius); box-shadow:var(--shadow);
  }
  .brand{display:flex; align-items:center; gap:13px; min-width:0}
  .mark{display:block; width:44px; height:44px; flex:none}
  .brand-text strong{display:block; font-size:23px; font-weight:800; letter-spacing:.04em; line-height:1.15}
  .brand-text small{display:block; color:var(--muted); font-size:12.5px; letter-spacing:.02em}
  .tagline{
    margin-left:auto; font-size:12.5px; font-weight:700; color:var(--ink);
    background:var(--yellow); border:2px solid var(--ink); border-radius:999px; padding:5px 13px; white-space:nowrap;
  }

  section{
    max-width:1080px; margin:0 auto 18px; padding:18px 20px 20px;
    background:var(--card); border:3px solid var(--ink); border-radius:var(--radius); box-shadow:var(--shadow);
  }
  h2{display:flex; align-items:center; gap:9px; margin:0 0 13px; font-size:16px; font-weight:800; letter-spacing:.01em}
  h2::before{content:""; width:13px; height:13px; flex:none; border:2.5px solid var(--ink); border-radius:5px; background:var(--violet)}
  section:nth-of-type(2) h2::before{background:var(--mint)}
  section:nth-of-type(3) h2::before{background:var(--yellow)}
  section:nth-of-type(4) h2::before{background:var(--coral)}
  section:nth-of-type(5) h2::before{background:var(--violet)}
  section:nth-of-type(6) h2::before{background:var(--mint)}

  .row{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
  .row + .row{margin-top:10px}
  .muted{color:var(--muted); font-size:13px}

  input, select, button{font:inherit; color:var(--ink)}
  input, select{
    min-width:210px; padding:8px 11px; background:#fff; border:2px solid var(--ink); border-radius:11px;
  }
  input::placeholder{color:#9C9384}
  input[type=file]{min-width:0; border-style:dashed; background:var(--card); padding:7px 10px}
  input[type=password]{min-width:210px}
  input:focus-visible, select:focus-visible, button:focus-visible, summary:focus-visible{
    outline:3px solid var(--violet); outline-offset:2px;
  }
  button{
    padding:8px 16px; font-weight:700; background:var(--card); border:2px solid var(--ink); border-radius:11px;
    box-shadow:3px 3px 0 var(--ink); cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
  }
  button:hover{transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--ink); background:#fff}
  button:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink)}
  #m-save, #ask{background:var(--violet); color:#fff}
  #m-save:hover, #ask:hover{background:var(--violet-dark)}
  #upload{background:var(--yellow)}
  #delete-dataset{background:#FFE1DA}

  p#banner{margin:0 auto 18px; max-width:1080px}
  .banner{
    padding:10px 14px; background:#EAF7EF; border:2px solid var(--ink); border-left:8px solid var(--mint);
    border-radius:12px; font-weight:600;
  }
  .banner.bad{background:#FFEDE9; border-left-color:var(--coral)}

  #sql-box{border:2px solid var(--ink); border-radius:12px; background:#fff; overflow:hidden; margin-top:12px}
  #sql-box summary{cursor:pointer; padding:9px 14px; font-weight:700; background:var(--yellow)}
  #sql-box[open] summary{border-bottom:2px solid var(--ink)}
  #sql-box pre{
    margin:0; padding:12px 14px; background:#17130E; color:#F6EEDC; overflow:auto;
    font:12.5px/1.6 ui-monospace,Consolas,monospace;
  }

  #steps{margin:0; padding:0; list-style:none; counter-reset:step}
  #steps li{
    counter-increment:step; position:relative; margin-bottom:8px; padding:7px 12px 7px 42px;
    background:#FFFCF4; border:2px solid var(--hair); border-radius:10px; font-size:13.5px; color:var(--ink-soft);
  }
  #steps li::before{
    content:counter(step); position:absolute; left:9px; top:7px; width:22px; height:22px; display:grid; place-items:center;
    background:var(--violet); color:#fff; border:2px solid var(--ink); border-radius:50%; font-size:11.5px; font-weight:700;
  }
  #steps:empty::after{content:"提问后，这里逐步显示模型调用了什么工具、耗时与返回行数"; color:var(--muted); font-size:13px}

  #insight{padding:14px 16px; background:#FFFBEF; border:2px dashed var(--hair); border-radius:12px}
  #insight > .muted{margin:0; text-align:center}
  .summary{margin:0 0 10px; font-size:15px; font-weight:700}
  #insight ul{margin:4px 0 10px; padding-left:20px}
  #insight li{margin:3px 0}
  #insight strong{display:inline-block}
  .caveat{margin-top:10px; padding:9px 12px; background:#FFF8E1; border-left:5px solid var(--yellow); border-radius:0 10px 10px 0}

  #chart{height:320px; margin:10px 0}
  #row-count{font-weight:600}

  .scroll{overflow:auto; max-height:420px; background:#fff; border:2px solid var(--hair); border-radius:12px}
  table{border-collapse:separate; border-spacing:0; width:100%; font-size:13.5px}
  th, td{padding:7px 11px; text-align:left; white-space:nowrap; border-bottom:1px solid var(--hair)}
  th{position:sticky; top:0; z-index:1; background:#FBF6EA; font-weight:700; border-bottom:2px solid var(--ink)}
  tbody tr:nth-child(even){background:#FFFCF4}
  tbody tr:hover{background:#FFF3D6}
  tbody tr:last-child td{border-bottom:0}

  @keyframes rise{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
  header.topbar, section{animation:rise .34s ease-out both}
  section:nth-of-type(2){animation-delay:.04s}
  section:nth-of-type(3){animation-delay:.08s}
  section:nth-of-type(4){animation-delay:.12s}
  section:nth-of-type(5){animation-delay:.16s}
  section:nth-of-type(6){animation-delay:.2s}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important} }
</style>
</head>
<body>
<header class="topbar">
  <span class="mark" aria-hidden="true">
    <svg viewBox="0 0 48 48" width="44" height="44">
      <rect x="3" y="3" width="42" height="42" rx="12" fill="#6B4BF6" stroke="#17130E" stroke-width="3"/>
      <rect x="11.5" y="24" width="6" height="13" rx="3" fill="#FFD34D" stroke="#17130E" stroke-width="2.5"/>
      <rect x="21" y="16" width="6" height="21" rx="3" fill="#FFF7E8" stroke="#17130E" stroke-width="2.5"/>
      <rect x="30.5" y="20" width="6" height="17" rx="3" fill="#FF6A54" stroke="#17130E" stroke-width="2.5"/>
      <circle cx="24" cy="9.6" r="2.6" fill="#FFF7E8" stroke="#17130E" stroke-width="2"/>
    </svg>
  </span>
  <span class="brand-text">
    <strong>知析</strong>
    <small>AI 数据分析助手 · 上传表格，用中文提问，拿到带依据的结论</small>
  </span>
  <span class="tagline">结论里的数字都可追溯</span>
</header>
<p id="banner" class="banner" hidden></p>

<section>
  <h2>1 模型配置</h2>
  <div class="row">
    <select id="model-select"></select>
    <span id="model-state" class="muted"></span>
  </div>
  <div class="row">
    <input id="m-id" placeholder="profile id，如 qwen">
    <input id="m-base" placeholder="base_url，如 https://dashscope.aliyuncs.com/compatible-mode/v1">
    <input id="m-model" placeholder="模型名，如 qwen-plus">
    <input id="m-key" type="password" placeholder="API Key（留空表示不改）">
    <button id="m-save">保存并启用</button>
    <button id="m-clear">清空密钥</button>
  </div>
</section>

<section>
  <h2>2 数据</h2>
  <div class="row">
    <input id="file" type="file" accept=".csv,.xlsx,.xls">
    <button id="upload">上传</button>
    <select id="dataset"></select>
    <button id="delete-dataset">删除数据集</button>
    <span id="dataset-state" class="muted"></span>
  </div>
</section>

<section>
  <h2>3 提问</h2>
  <div class="row">
    <input id="question" placeholder="例如：上月华东区销售额环比下降的产品有哪些">
    <button id="ask">提问</button>
  </div>
  <details id="sql-box" hidden><summary>SQL</summary><pre id="sql"></pre></details>
  <p id="degraded" class="banner" hidden></p>
</section>

<section>
  <h2>4 步骤</h2>
  <ol id="steps"></ol>
</section>

<section>
  <h2>5 结论</h2>
  <div id="insight"><p class="muted">还没有结论</p></div>
</section>

<section>
  <h2>6 结果</h2>
  <div class="row">
    <span id="row-count" class="muted"></span>
    <select id="chart-type">
      <option value="bar">柱状图</option>
      <option value="line">折线图</option>
      <option value="pie">饼图</option>
    </select>
  </div>
  <div id="chart"></div>
  <p id="chart-note" class="muted" hidden></p>
  <div class="scroll"><table id="table"></table></div>
</section>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

function el(tag, props = {}, ...kids) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (key === "text") node.textContent = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value);
  }
  node.append(...kids.filter((kid) => kid !== null && kid !== undefined));
  return node;
}

function say(id, message, bad = false) {
  const box = $(id);
  box.textContent = message || "";
  box.hidden = !message;
  box.classList.toggle("bad", Boolean(bad));
}

async function run(action) {
  try {
    await action();
  } catch (error) {
    say("banner", error.message, true);
  }
}

async function api(path, options) {
  const response = await fetch(path, options);
  const body = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(body.detail || `请求失败：${response.status}`);
  return body;
}

const postJson = (path, data) =>
  api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });

// ---- 模型配置 ----
let profiles = [];

function renderProfiles(list) {
  profiles = list;
  $("model-select").replaceChildren(
    ...list.map((item) => el("option", { value: item.id, text: `${item.id} · ${item.model}` })),
  );
  $("model-state").textContent = list.map((item) => `${item.id}：${item.has_key ? "已配密钥" : "未配密钥"}`).join("；");
}

function fillProfileForm() {
  const found = profiles.find((item) => item.id === $("model-select").value);
  if (!found) return;
  $("m-id").value = found.id || "";
  $("m-base").value = found.base_url || "";
  $("m-model").value = found.model || "";
}

async function loadProfiles() {
  renderProfiles((await api("/settings/models")).models);
}

async function saveProfile(apiKey) {
  const payload = {
    id: $("m-id").value.trim(),
    base_url: $("m-base").value.trim(),
    model: $("m-model").value.trim(),
  };
  if (apiKey !== null) payload.api_key = apiKey;
  const saved = await api("/settings/models", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  renderProfiles(saved.models);
  $("m-key").value = "";
  say("banner", `已保存并启用 ${payload.id}`);
}

// ---- 数据 ----
async function loadDatasets(selectId) {
  const list = await api("/datasets");
  $("dataset").replaceChildren(
    ...list.map((item) => el("option", { value: item.id, text: `${item.name || item.id}（${item.rows} 行 × ${item.cols} 列）` })),
  );
  if (selectId) $("dataset").value = selectId;
  $("dataset-state").textContent = list.length ? `${list.length} 个数据集` : "还没有数据集，先上传";
}

async function upload() {
  const file = $("file").files[0];
  if (!file) throw new Error("先选一个 CSV/XLSX 文件");
  const form = new FormData();
  form.append("file", file);
  const result = await api("/datasets", { method: "POST", body: form });
  await loadDatasets(result.dataset_id);
  say("banner", `已上传 ${result.dataset_id}：${result.rows} 行 × ${result.cols} 列`);
}

async function deleteDataset() {
  const dataset_id = $("dataset").value;
  if (!dataset_id) throw new Error("先选一个数据集");
  if (!confirm(`删除数据集 ${dataset_id}？DuckDB 表、上传文件与提问记录会一起清掉`)) return;
  const result = await api(`/datasets/${dataset_id}`, { method: "DELETE" });
  await loadDatasets();
  // 正看着的就是被删的数据集时，把结果区一并清掉，免得留着已删数据的表
  if (last && last.dataset_id === dataset_id) {
    last = null;
    render({ dataset_id, sql: "", steps: [], insight: null, columns: [], rows: [], row_count: 0, degraded: [] });
  }
  say("banner", `已删除 ${result.dataset_id}（表 ${result.table}）`);
}

// ---- 提问与结果 ----
let last = null;
let chart = null;

async function ask() {
  const dataset_id = $("dataset").value;
  const question = $("question").value.trim();
  if (!dataset_id) throw new Error("先上传并选择一个数据集");
  if (!question) throw new Error("问题不能为空");
  say("banner", "");
  const body = await postJson("/ask", { dataset_id, question });
  last = body;
  render(body);
}

function render(body) {
  const degraded = body.degraded || [];
  say("degraded", degraded.length ? `已降级：${degraded.join("、")}${body.message ? `；${body.message}` : ""}` : "", degraded.length > 0);
  $("sql-box").hidden = !body.sql;
  $("sql").textContent = body.sql || "";
  $("steps").replaceChildren(
    ...(body.steps || []).map((step) =>
      el("li", {
        text: `第 ${step.n} 步 ${step.tool} · ${step.ms}ms · ${step.rows} 行${step.ok ? "" : ` · 失败：${step.error || ""}`} · ${step.args_digest}`,
      }),
    ),
  );
  renderInsight(body.insight);
  $("row-count").textContent = `${body.row_count ?? (body.rows || []).length} 行${body.truncated ? "（已截断）" : ""}`;
  say("banner", "已完成，见下方结论");
  renderTable(body.columns || [], body.rows || []);
  renderChart(body.columns || [], body.rows || []);
}

function bullets(title, items) {
  if (!items.length) return [];
  const head = title ? [el("strong", { text: title })] : [];
  return [el("div", {}, ...head, el("ul", {}, ...items.map((text) => el("li", { text }))))];
}

function renderInsight(insight) {
  if (!insight) {
    $("insight").replaceChildren(el("p", { class: "muted", text: "没有结论（模型不可用或结果为空）" }));
    return;
  }
  const block = [el("p", { class: "summary", text: insight.summary })];
  block.push(...bullets("发现", (insight.findings || []).map((f) => `${f.title}${f.detail ? `：${f.detail}` : ""}`)));
  block.push(...bullets("建议", (insight.suggestions || []).map((s) => `${s.action}${s.rationale ? `（${s.rationale}）` : ""}`)));
  if ((insight.anomalies || []).length) block.push(el("p", { text: `异常 ${insight.anomalies.length} 处` }));
  if ((insight.caveats || []).length) {
    block.push(el("div", { class: "caveat" }, el("strong", { text: "注意事项" }), ...bullets(null, insight.caveats)));
  }
  block.push(el("p", { class: "muted", text: `置信度：${insight.confidence}` }));
  $("insight").replaceChildren(...block);
}

function renderTable(columns, rows) {
  const head = el("thead", {}, el("tr", {}, ...columns.map((name) => el("th", { text: String(name) }))));
  const body = el(
    "tbody",
    {},
    ...rows.map((row) =>
      el("tr", {}, ...row.map((cell) => el("td", { text: cell === null || cell === undefined ? "" : String(cell) }))),
    ),
  );
  $("table").replaceChildren(head, body);
}

const chartTheme = {
  color: ["#6B4BF6", "#FFD34D", "#FF6A54", "#2F9E5F", "#5433D6", "#B08C00"],
  textStyle: { color: "#443C31", fontFamily: 'system-ui, "Microsoft YaHei", sans-serif' },
  grid: { left: 12, right: 18, top: 28, bottom: 6, containLabel: true },
  tooltip: { borderColor: "#17130E", borderWidth: 2, backgroundColor: "#FFFDF8", textStyle: { color: "#17130E" } },
};

function renderChart(columns, rows) {
  const metric = columns.findIndex((_, index) => rows.every((row) => typeof row[index] === "number"));
  const label = columns.findIndex((_, index) => !rows.every((row) => typeof row[index] === "number"));
  if (typeof echarts === "undefined") {
    say("chart-note", "未加载本地 ECharts（web/vendor/echarts.min.js），只显示表格");
    return;
  }
  chart = chart || echarts.init($("chart"));
  if (!rows.length || metric < 0) {
    say("chart-note", rows.length ? "结果里没有数值列，跳过图表" : "");
    chart.clear();
    return;
  }
  say("chart-note", "");
  const labels = rows.map((row, index) => (label >= 0 ? String(row[label]) : `第 ${index + 1} 行`));
  const numbers = rows.map((row) => row[metric]);
  const type = $("chart-type").value;
  const option =
    type === "pie"
      ? {
          series: [
            {
              type: "pie",
              radius: "60%",
              itemStyle: { borderColor: "#17130E", borderWidth: 2 },
              label: { color: "#443C31" },
              data: labels.map((name, index) => ({ name, value: numbers[index] })),
            },
          ],
        }
      : {
          tooltip: { trigger: "axis" },
          xAxis: {
            type: "category",
            data: labels,
            axisLine: { lineStyle: { color: "#17130E", width: 2 } },
            axisTick: { show: false },
          },
          yAxis: {
            type: "value",
            splitLine: { lineStyle: { color: "#E7DFCE" } },
            axisLine: { show: false },
          },
          series: [
            {
              name: columns[metric],
              type,
              itemStyle: { borderColor: "#17130E", borderWidth: 2, borderRadius: type === "bar" ? [6, 6, 0, 0] : 0 },
              data: numbers,
            },
          ],
        };
  chart.setOption({ ...chartTheme, ...option }, true);
}

(async function start() {
  $("model-select").addEventListener("change", fillProfileForm);
  $("m-save").addEventListener("click", () => run(() => saveProfile($("m-key").value || null)));
  $("m-clear").addEventListener("click", () => run(() => saveProfile("")));
  $("upload").addEventListener("click", () => run(upload));
  $("delete-dataset").addEventListener("click", () => run(deleteDataset));
  $("ask").addEventListener("click", () => run(ask));
  $("chart-type").addEventListener("change", () => { if (last) renderChart(last.columns || [], last.rows || []); });
  window.addEventListener("resize", () => { if (chart) chart.resize(); });
  await run(async () => {
    await loadProfiles();
    fillProfileForm();
    await loadDatasets();
  });
})();
</script>
</body>
</html>
