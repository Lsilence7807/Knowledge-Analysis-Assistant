<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AI 数据分析助手</title>
<script src="/vendor/echarts.min.js"></script>
<style>
  body { font: 14px/1.6 system-ui, "Microsoft YaHei", sans-serif; margin: 24px; color: #1f2328; }
  h1 { font-size: 20px; }
  h2 { font-size: 15px; margin: 22px 0 8px; }
  section { max-width: 1080px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  input, select, button { font: inherit; padding: 5px 8px; border: 1px solid #d0d7de; border-radius: 6px; }
  input { min-width: 220px; }
  button { background: #f6f8fa; cursor: pointer; }
  button:hover { background: #eaeef2; }
  .muted { color: #656d76; }
  .banner { padding: 8px 12px; border: 1px solid #d0d7de; border-left: 4px solid #1a7f37; border-radius: 6px; background: #f6f8fa; }
  .banner.bad { border-left-color: #cf222e; }
  .scroll { overflow: auto; max-height: 360px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #d0d7de; padding: 4px 8px; text-align: left; white-space: nowrap; }
  th { background: #f6f8fa; position: sticky; top: 0; }
  #chart { height: 320px; margin: 8px 0; }
  #sql-box pre { background: #f6f8fa; padding: 8px; overflow: auto; }
  .caveat { border-left: 3px solid #bf8700; padding-left: 10px; margin-top: 8px; }
  .summary { font-weight: 600; margin: 4px 0; }
</style>
</head>
<body>
<h1>AI 数据分析助手</h1>
<p id="banner" class="banner" hidden></p>

<section>
  <h2>1 模型配置</h2>
  <div class="row">
    <select id="model-select"></select>
    <span id="model-state" class="muted"></span>
  </div>
  <div class="row">
    <input id="m-id" placeholder="profile id，如 qwen">
    <input id="m-base" placeholder="base_url，如 https://dashscope.aliyuncs.com/compatible-mode/v1">
    <input id="m-model" placeholder="模型名，如 qwen-plus">
    <input id="m-key" type="password" placeholder="API Key（留空表示不改）">
    <button id="m-save">保存并启用</button>
    <button id="m-clear">清空密钥</button>
  </div>
</section>

<section>
  <h2>2 数据</h2>
  <div class="row">
    <input id="file" type="file" accept=".csv,.xlsx,.xls">
    <button id="upload">上传</button>
    <select id="dataset"></select>
    <span id="dataset-state" class="muted"></span>
  </div>
</section>

<section>
  <h2>3 提问</h2>
  <div class="row">
    <input id="question" placeholder="例如：上月华东区销售额环比下降的产品有哪些">
    <button id="ask">提问</button>
  </div>
  <details id="sql-box" hidden><summary>SQL</summary><pre id="sql"></pre></details>
  <p id="degraded" class="banner" hidden></p>
</section>

<section>
  <h2>4 步骤</h2>
  <ol id="steps"></ol>
</section>

<section>
  <h2>5 结论</h2>
  <div id="insight"><p class="muted">还没有结论</p></div>
</section>

<section>
  <h2>6 结果</h2>
  <div class="row">
    <span id="row-count" class="muted"></span>
    <select id="chart-type">
      <option value="bar">柱状图</option>
      <option value="line">折线图</option>
      <option value="pie">饼图</option>
    </select>
  </div>
  <div id="chart"></div>
  <p id="chart-note" class="muted" hidden></p>
  <div class="scroll"><table id="table"></table></div>
</section>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

function el(tag, props = {}, ...kids) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (key === "text") node.textContent = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value);
  }
  node.append(...kids.filter((kid) => kid !== null && kid !== undefined));
  return node;
}

function say(id, message, bad = false) {
  const box = $(id);
  box.textContent = message || "";
  box.hidden = !message;
  box.classList.toggle("bad", Boolean(bad));
}

async function run(action) {
  try {
    await action();
  } catch (error) {
    say("banner", error.message, true);
  }
}

async function api(path, options) {
  const response = await fetch(path, options);
  const body = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(body.detail || `请求失败：${response.status}`);
  return body;
}

const postJson = (path, data) =>
  api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });

// ---- 模型配置 ----
let profiles = [];

function renderProfiles(list) {
  profiles = list;
  $("model-select").replaceChildren(
    ...list.map((item) => el("option", { value: item.id, text: `${item.id} · ${item.model}` })),
  );
  $("model-state").textContent = list.map((item) => `${item.id}：${item.has_key ? "已配密钥" : "未配密钥"}`).join("；");
}

function fillProfileForm() {
  const found = profiles.find((item) => item.id === $("model-select").value);
  if (!found) return;
  $("m-id").value = found.id || "";
  $("m-base").value = found.base_url || "";
  $("m-model").value = found.model || "";
}

async function loadProfiles() {
  renderProfiles((await api("/settings/models")).models);
}

async function saveProfile(apiKey) {
  const payload = {
    id: $("m-id").value.trim(),
    base_url: $("m-base").value.trim(),
    model: $("m-model").value.trim(),
  };
  if (apiKey !== null) payload.api_key = apiKey;
  const saved = await api("/settings/models", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  renderProfiles(saved.models);
  $("m-key").value = "";
  say("banner", `已保存并启用 ${payload.id}`);
}

// ---- 数据 ----
async function loadDatasets(selectId) {
  const list = await api("/datasets");
  $("dataset").replaceChildren(
    ...list.map((item) => el("option", { value: item.id, text: `${item.name || item.id}（${item.rows} 行 × ${item.cols} 列）` })),
  );
  if (selectId) $("dataset").value = selectId;
  $("dataset-state").textContent = list.length ? `${list.length} 个数据集` : "还没有数据集，先上传";
}

async function upload() {
  const file = $("file").files[0];
  if (!file) throw new Error("先选一个 CSV/XLSX 文件");
  const form = new FormData();
  form.append("file", file);
  const result = await api("/datasets", { method: "POST", body: form });
  await loadDatasets(result.dataset_id);
  say("banner", `已上传 ${result.dataset_id}：${result.rows} 行 × ${result.cols} 列`);
}

// ---- 提问与结果 ----
let last = null;
let chart = null;

async function ask() {
  const dataset_id = $("dataset").value;
  const question = $("question").value.trim();
  if (!dataset_id) throw new Error("先上传并选择一个数据集");
  if (!question) throw new Error("问题不能为空");
  say("banner", "");
  const body = await postJson("/ask", { dataset_id, question });
  last = body;
  render(body);
}

function render(body) {
  const degraded = body.degraded || [];
  say("degraded", degraded.length ? `已降级：${degraded.join("、")}${body.message ? `；${body.message}` : ""}` : "", degraded.length > 0);
  $("sql-box").hidden = !body.sql;
  $("sql").textContent = body.sql || "";
  $("steps").replaceChildren(
    ...(body.steps || []).map((step) =>
      el("li", {
        text: `第 ${step.n} 步 ${step.tool} · ${step.ms}ms · ${step.rows} 行${step.ok ? "" : ` · 失败：${step.error || ""}`} · ${step.args_digest}`,
      }),
    ),
  );
  renderInsight(body.insight);
  $("row-count").textContent = `${body.row_count ?? (body.rows || []).length} 行${body.truncated ? "（已截断）" : ""}`;
  if (body.message) say("banner", body.message);
  renderTable(body.columns || [], body.rows || []);
  renderChart(body.columns || [], body.rows || []);
}

function bullets(title, items) {
  if (!items.length) return [];
  const head = title ? [el("strong", { text: title })] : [];
  return [el("div", {}, ...head, el("ul", {}, ...items.map((text) => el("li", { text }))))];
}

function renderInsight(insight) {
  if (!insight) {
    $("insight").replaceChildren(el("p", { class: "muted", text: "没有结论（模型不可用或结果为空）" }));
    return;
  }
  const block = [el("p", { class: "summary", text: insight.summary })];
  block.push(...bullets("发现", (insight.findings || []).map((f) => `${f.title}${f.detail ? `：${f.detail}` : ""}`)));
  block.push(...bullets("建议", (insight.suggestions || []).map((s) => `${s.action}${s.rationale ? `（${s.rationale}）` : ""}`)));
  if ((insight.anomalies || []).length) block.push(el("p", { text: `异常 ${insight.anomalies.length} 处` }));
  if ((insight.caveats || []).length) {
    block.push(el("div", { class: "caveat" }, el("strong", { text: "注意事项" }), ...bullets(null, insight.caveats)));
  }
  block.push(el("p", { class: "muted", text: `置信度：${insight.confidence}` }));
  $("insight").replaceChildren(...block);
}

function renderTable(columns, rows) {
  const head = el("thead", {}, el("tr", {}, ...columns.map((name) => el("th", { text: String(name) }))));
  const body = el(
    "tbody",
    {},
    ...rows.map((row) =>
      el("tr", {}, ...row.map((cell) => el("td", { text: cell === null || cell === undefined ? "" : String(cell) }))),
    ),
  );
  $("table").replaceChildren(head, body);
}

function renderChart(columns, rows) {
  const metric = columns.findIndex((_, index) => rows.every((row) => typeof row[index] === "number"));
  const label = columns.findIndex((_, index) => !rows.every((row) => typeof row[index] === "number"));
  if (typeof echarts === "undefined") {
    say("chart-note", "未加载本地 ECharts（web/vendor/echarts.min.js），只显示表格");
    return;
  }
  chart = chart || echarts.init($("chart"));
  if (!rows.length || metric < 0) {
    say("chart-note", rows.length ? "结果里没有数值列，跳过图表" : "");
    chart.clear();
    return;
  }
  say("chart-note", "");
  const labels = rows.map((row, index) => (label >= 0 ? String(row[label]) : `第 ${index + 1} 行`));
  const numbers = rows.map((row) => row[metric]);
  const type = $("chart-type").value;
  const option =
    type === "pie"
      ? { series: [{ type: "pie", radius: "60%", data: labels.map((name, index) => ({ name, value: numbers[index] })) }] }
      : {
          tooltip: { trigger: "axis" },
          xAxis: { type: "category", data: labels },
          yAxis: { type: "value" },
          series: [{ name: columns[metric], type, data: numbers }],
        };
  chart.setOption(option, true);
}

(async function start() {
  $("model-select").addEventListener("change", fillProfileForm);
  $("m-save").addEventListener("click", () => run(() => saveProfile($("m-key").value || null)));
  $("m-clear").addEventListener("click", () => run(() => saveProfile("")));
  $("upload").addEventListener("click", () => run(upload));
  $("ask").addEventListener("click", () => run(ask));
  $("chart-type").addEventListener("change", () => { if (last) renderChart(last.columns || [], last.rows || []); });
  window.addEventListener("resize", () => { if (chart) chart.resize(); });
  await run(async () => {
    await loadProfiles();
    fillProfileForm();
    await loadDatasets();
  });
})();
</script>
</body>
</html>
