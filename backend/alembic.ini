# file: backend/alembic.ini
# role: alembic config; script_location points at backend/app/alembic (F6).
# note: DB url is injected by app/alembic/env.py from app/core/config.py (no hardcoded paths here).
# stage: F6 data layer -> SQLAlchemy + Alembic
[alembic]
script_location = app/alembic
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
